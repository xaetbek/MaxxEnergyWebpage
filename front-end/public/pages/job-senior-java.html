<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Senior Java Developer - MAXX Potential</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; line-height: 1.6; }
    .container { max-width: 800px; margin: auto; }
    h1, h2 { text-align: center; }
    form { margin-top: 30px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input, textarea, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; }
    input.error, textarea.error, select.error { border: 1px solid red; }
    .error-message { color: red; font-size: 0.9em; margin-top: 5px; }
    button { padding: 10px 20px; background: #0073e6; color: #fff; border: none; border-radius: 5px; cursor: pointer; }
    button:hover { background: #005bb5; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Senior Java Developer</h1>
    <h2>MAXX Potential</h2>
    <p><strong>Location:</strong> Richmond, VA; Durham, NC; Norfolk, VA; Remote</p>
    <p><strong>Full-time</strong></p>
    <p>MAXX Potential helps organizations diversify and strengthen their tech talent pipeline... [FULL DESCRIPTION CONTENT HERE — same as you provided]</p>

    <h2>Apply Now</h2>
    <form id="jobForm" novalidate>
      <div class="form-group">
        <label>First Name*</label>
        <input type="text" name="firstName" required />
      </div>
      <div class="form-group">
        <label>Last Name*</label>
        <input type="text" name="lastName" required />
      </div>
      <div class="form-group">
        <label>Email*</label>
        <input type="email" name="email" required />
      </div>
      <div class="form-group">
        <label>Phone Number*</label>
        <input type="tel" name="phone" required />
      </div>
      <div class="form-group">
        <label>Address*</label>
        <input type="text" name="address" required />
      </div>
      <div class="form-group">
        <label>Address Line 1</label>
        <input type="text" name="address1" />
      </div>
      <div class="form-group">
        <label>Address Line 2</label>
        <input type="text" name="address2" />
      </div>
      <div class="form-group">
        <label>City</label>
        <input type="text" name="city" />
      </div>
      <div class="form-group">
        <label>State / Province / Region</label>
        <input type="text" name="state" />
      </div>
      <div class="form-group">
        <label>ZIP / Postal Code</label>
        <input type="text" name="zip" />
      </div>
      <div class="form-group">
        <label>Country</label>
        <select name="country">
          <option value="">Select Country</option>
          <option>United States</option>
          <option>Canada</option>
          <option>United Kingdom</option>
          <option>Other</option>
        </select>
      </div>
      <div class="form-group">
        <label>Attach Resume</label>
        <input type="file" name="resume" />
      </div>
      <div class="form-group">
        <label>Attach Cover Letter</label>
        <input type="file" name="coverLetter" />
      </div>
      <div class="form-group">
        <label>Why do you want to work at MAXX Potential?</label>
        <textarea name="q1"></textarea>
      </div>
      <div class="form-group">
        <label>How do our core values resonate with you?</label>
        <textarea name="q2"></textarea>
      </div>
      <div class="form-group">
        <label>How do you grow your skills?</label>
        <textarea name="q3"></textarea>
      </div>
      <div class="form-group">
        <label>Do you prefer “big picture” or “small details”? Example:</label>
        <textarea name="q4"></textarea>
      </div>
      <button type="submit">Submit</button>
      <p id="formError" class="error-message"></p>
    </form>
  </div>

  <script>
    document.getElementById("jobForm").addEventListener("submit", function(e) {
      e.preventDefault();
      let isValid = true;
      let errorMessage = "";

      document.querySelectorAll("#jobForm [required]").forEach(field => {
        if (!field.value.trim()) {
          field.classList.add("error");
          isValid = false;
        } else {
          field.classList.remove("error");
        }
      });

      if (!isValid) {
        errorMessage = "Some necessary fields cannot be empty.";
        document.getElementById("formError").textContent = errorMessage;
      } else {
        document.getElementById("formError").textContent = "";
        alert("Application submitted successfully!");
        // Here you would send the form data to your backend API
      }
    });
  </script>
</body>
</html>
